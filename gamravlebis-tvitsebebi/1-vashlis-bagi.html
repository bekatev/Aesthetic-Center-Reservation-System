<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ვაშლის ბაღი — გამრავლება</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d2430; --good:#157a3e; --bad:#b42318; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Noto Sans Georgian", "DejaVu Sans", "Segoe UI", sans-serif;
    background: linear-gradient(#d9f0ff, #e8f6ff 320px, #8dce6a 320px, #67b84d 100%);
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  header a { color: var(--ink); font-weight: 800; text-decoration: none; background: rgba(255,255,255,.8); padding: 8px 12px; border-radius: 999px; }
  h1 { margin: 10px 0 0; font-size: clamp(28px, 4vw, 42px); }
  .sub { margin: 4px 0 12px; font-size: 16px; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: end; flex-wrap: wrap; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.55); display: block; }
  .dots i.on { background: #f2c14e; box-shadow: 0 0 0 3px white; }
  .dots i.done { background: var(--good); }
  .panel {
    background: rgba(255,255,255,.94); border-radius: 28px; padding: 18px;
    box-shadow: 0 18px 0 rgba(38, 90, 28, .18);
  }
  .mission { font-size: clamp(20px, 3vw, 28px); font-weight: 800; margin: 0 0 6px; line-height: 1.3; }
  .msg { min-height: 28px; font-weight: 700; margin: 8px 0; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--good); }
  .garden { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 12px 0; min-height: 120px; }
  .crate {
    background: #fffaf0; border: 3px solid #efd7a4; border-radius: 20px; padding: 10px;
    min-width: 104px; box-shadow: 0 8px 0 #efd7a4; text-align: center;
  }
  .crate .label { font-size: 13px; font-weight: 800; color: #8a6230; }
  .fruits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 168px; min-height: 42px; }
  .apple, .person { width: 34px; height: 38px; display: inline-block; }
  .apple svg, .person svg { width: 100%; height: 100%; display: block; }
  .pop { animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
  .fix-actions { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .formula {
    text-align: center; font-size: clamp(20px, 3vw, 30px); font-weight: 800;
    background: #fff7df; border-radius: 16px; padding: 10px; margin: 8px 0 12px;
  }
  .controls, .choices, .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .stepper, button {
    font-family: inherit; font-weight: 800; border: 0; border-radius: 16px; cursor: pointer;
  }
  .stepper { display: flex; align-items: center; gap: 8px; background: #f4f7f2; padding: 8px 10px; }
  .stepper b { min-width: 28px; text-align: center; font-size: 24px; }
  button { background: #1f7a45; color: white; padding: 12px 16px; font-size: 17px; border-bottom: 4px solid #145c32; }
  button.ghost { background: white; color: var(--ink); border: 2px solid #d9d0c2; border-bottom-width: 4px; }
  button.tiny { padding: 6px 10px; font-size: 16px; }
  button:active { transform: translateY(2px); border-bottom-width: 2px; }
  button:disabled { opacity: .55; cursor: default; transform: none; }
  button.choice { min-width: 120px; background: white; color: var(--ink); border: 3px solid #eadfcd; border-bottom-width: 6px; font-size: 24px; }
  button.choice.bad { background: #ffe1e1; border-color: #e7a8a4; }
  button.choice.good { background: #e5f8ee; border-color: #86d3a8; }
  .card { background: white; border-radius: 24px; padding: 16px; }
  .shake { animation: shake .4s linear; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .stars { color: #e7a317; letter-spacing: 2px; font-size: 22px; }
  .done h2, .hero h2 { margin: 0 0 8px; font-size: 32px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
  .confetti i { position: absolute; top: -16px; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.4s ease-in forwards; }
  @keyframes fall { to { top: 110vh; transform: rotate(240deg); } }
  .iconbtn { background: white; color: var(--ink); border: 2px solid #d9d0c2; border-bottom: 4px solid #d9d0c2; padding: 8px 12px; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html">ყველა თამაში</a>
    <div>
      <button class="iconbtn" id="mute" type="button">ხმა</button>
      <button class="iconbtn" id="reset" type="button">თავიდან</button>
    </div>
  </header>
  <div class="top">
    <div>
      <h1>ვაშლის ბაღი</h1>
      <p class="sub">გამრავლება განმეორებითი შეკრების მოკლე ჩანაწერია.</p>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="panel" id="stage"></div>
</div>
<script>
const LEVELS = [
  { mode: "plant", item: "apple", g: 3, e: 2, title: "პატარა ბაღი", lead: "ააწყვე 3 ჯგუფი, თითო ჯგუფში 2 ვაშლი." },
  { mode: "read", item: "apple", g: 4, e: 3, title: "დაითვალე ბაღი", lead: "რომელი ჩანაწერი ეწერება ამ სურათს?" },
  { mode: "story", item: "kid", g: 5, e: 6, title: "ხუთი გუნდი", lead: "შეჯიბრზე 5 გუნდია. თითო გუნდში 6 მოსწავლე. ასე ააწყვე." },
  { mode: "fix", item: "apple", g: 4, e: 3, broken: [3, 3, 2, 3], title: "გაასწორე რიგი", lead: "ჯგუფები თანაბარი უნდა გახდეს: 4 · 3." },
  { mode: "read", item: "apple", g: 2, e: 8, title: "ორი კალათა", lead: "მოკლე ჩანაწერი რომელია?" },
  { mode: "plant", item: "apple", g: 6, e: 4, title: "ექვსი რიგი", lead: "ააწყვე 6 ჯგუფი, თითოში 4 ვაშლი." },
  { mode: "read", item: "kid", g: 7, e: 3, title: "შვიდი რიგი", lead: "რამდენი ჯგუფია და თითოში რამდენი მოსწავლე?" },
  { mode: "fix", item: "apple", g: 6, e: 2, broken: [2, 2, 2, 1, 2, 2], title: "ერთი აკლია", lead: "ერთ ჯგუფს ვაშლი აკლია. გაათანაბრე: 6 · 2." },
  { mode: "read", item: "apple", g: 9, e: 2, title: "ცხრა წყვილი", lead: "დათვალე ჯგუფები, მერე აირჩიე ნამრავლი." },
  { mode: "finale", item: "kid", g: 4, e: 6, title: "ფინალი", lead: "ჯერ ჩანაწერი აირჩიე, მერე სულ რამდენი მოსწავლეა." }
];

const state = {
  screen: "intro",
  i: 0,
  stars: [],
  tries: 0,
  g: 1,
  e: 1,
  groups: [],
  step: "build",
  options: [],
  totalOptions: [],
  bad: new Set(),
  msg: "",
  msgKind: "",
  shake: false,
  pop: false
};

const stage = document.getElementById("stage");
const Sound = makeSound();

function word(item) { return item === "kid" ? "მოსწავლე" : "ვაშლი"; }
function glyph(item) {
  if (item === "kid") {
    return '<span class="person"><svg viewBox="0 0 32 36"><circle cx="16" cy="10" r="7" fill="#f2c14e"/><path d="M6 34c1-8 6-12 10-12s9 4 10 12" fill="#3d7ea6"/></svg></span>';
  }
  return '<span class="apple"><svg viewBox="0 0 32 36"><path d="M16 8c1-4 5-6 8-6-1 4-1 6 0 8" stroke="#2f7d32" fill="none" stroke-width="2"/><ellipse cx="16" cy="22" rx="10" ry="11" fill="#e23b3b"/><ellipse cx="12" cy="18" rx="3" ry="4" fill="#ffb4b0"/></svg></span>';
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeOptions(L) {
  const good = L.g + " · " + L.e;
  const traps = [
    L.g + " + " + L.e,
    L.g + " · " + (L.e + 1),
    Math.max(1, L.g - 1) + " · " + L.e,
    L.g + " · " + Math.max(1, L.e - 1),
    (L.g + L.e) + ""
  ];
  const uniq = [];
  traps.forEach((t) => { if (t !== good && !uniq.includes(t)) uniq.push(t); });
  return shuffle([good, ...uniq.slice(0, 3)]);
}

function makeTotals(L) {
  const good = L.g * L.e;
  const traps = [L.g + L.e, Number(String(L.g) + String(L.e)), good + 2];
  const uniq = [];
  traps.forEach((n) => { if (n !== good && uniq.indexOf(n) < 0) uniq.push(n); });
  return shuffle([good, ...uniq.slice(0, 3)]);
}

function explainChoice(text, L) {
  const good = L.g + " · " + L.e;
  if (text === good) return "";
  if (text.indexOf("+") >= 0) {
    return "ეს შეკრებაა. სურათზე ერთნაირი ჯგუფებია, ამიტომ გამრავლება იწერება: " + good + ".";
  }
  if (text.indexOf("·") < 0) {
    return "ეს მხოლოდ ჯამის რიცხვია. სურათს ეწერება ნამრავლი: " + good + ".";
  }
  const parts = text.split(" · ").map(Number);
  if (parts[0] !== L.g) return "სურათზე " + L.g + " ჯგუფია, აქ კი " + parts[0] + " წერია.";
  if (parts[1] !== L.e) return "თითო ჯგუფში " + L.e + " " + word(L.item) + "ა, აქ კი " + parts[1] + " წერია.";
  return "კიდევ დააკვირდი სურათს.";
}

function explainTotal(n, L) {
  const good = L.g * L.e;
  if (n === L.g + L.e) return L.g + " + " + L.e + " = " + n + " შეკრება იქნებოდა. აქ " + L.g + "-ჯერ გვაქვს " + L.e + ", ამიტომ " + L.g + " · " + L.e + " = " + good + ".";
  if (n === Number(String(L.g) + String(L.e))) return "რიცხვები გვერდიგვერდ არ იწერება პასუხად. " + L.g + " · " + L.e + " = " + good + ".";
  return "კიდევ დათვალე. " + sumText(L.e, L.g) + " = " + good + ".";
}

function sumText(each, groups) {
  if (groups > 6) return each + "-ის " + groups + "-ჯერ";
  return Array(groups).fill(String(each)).join(" + ");
}

function currentGroups() {
  const L = LEVELS[state.i];
  if (L.mode === "fix") return state.groups;
  if (L.mode === "plant" || (L.mode === "story" && state.step === "build")) return Array(state.g).fill(state.e);
  return Array(L.g).fill(L.e);
}

function startLevel() {
  const L = LEVELS[state.i];
  state.tries = 0;
  state.g = 1;
  state.e = 1;
  state.groups = L.broken ? L.broken.slice() : [];
  state.step = (L.mode === "read" || L.mode === "finale") ? "read" : "build";
  state.options = (state.step === "read") ? makeOptions(L) : [];
  state.totalOptions = [];
  state.bad = new Set();
  state.msg = "";
  state.msgKind = "";
  state.screen = "level";
  render();
}

function mismatch(groups, L) {
  if (groups.length !== L.g && groups[0] === L.e) return "თითოში რაოდენობა სწორია. ჯგუფი კი " + groups.length + "-ია, საჭიროა " + L.g + ".";
  if (groups.length === L.g && groups[0] !== L.e) return "ჯგუფების რაოდენობა სწორია. თითოში " + groups[0] + "-ია, საჭიროა " + L.e + ".";
  return "საჭიროა " + L.g + " ჯგუფი, თითოში " + L.e + ". ახლა " + groups.length + " ჯგუფია, თითოში " + groups[0] + ".";
}

function buzz(text) {
  state.tries += 1;
  state.msg = text;
  state.msgKind = "bad";
  state.shake = true;
  Sound.bad();
  render();
  setTimeout(() => {
    state.shake = false;
    const el = document.querySelector(".shake");
    if (el) el.classList.remove("shake");
  }, 450);
}

function afterMain() {
  const L = LEVELS[state.i];
  if ((L.mode === "story" || L.mode === "finale") && state.step !== "total") {
    state.step = "total";
    state.totalOptions = makeTotals(L);
    state.bad = new Set();
    state.msg = L.item === "kid" ? "სურათი სწორია. სულ რამდენი მოსწავლეა?" : "სურათი სწორია. სულ რამდენი ვაშლია?";
    state.msgKind = "ok";
    Sound.ok();
    render();
    return;
  }
  const stars = state.tries === 0 ? 3 : state.tries === 1 ? 2 : 1;
  state.stars[state.i] = stars;
  state.step = "done";
  state.msg = "";
  Sound.win();
  confetti();
  render();
}

function checkBuild() {
  const L = LEVELS[state.i];
  const groups = currentGroups();
  if (!groups.length) return buzz("ჯერ ერთი ჯგუფი მაინც დაამატე.");
  if (!groups.every((n) => n === groups[0])) return buzz("ჯგუფები ჯერ თანაბარი არ არის. გამრავლებაში ერთნაირი შესაკრებები იწერება.");
  if (groups.length !== L.g || groups[0] !== L.e) return buzz(mismatch(groups, L));
  afterMain();
}

function pickExpr(text) {
  const L = LEVELS[state.i];
  const good = L.g + " · " + L.e;
  if (state.bad.has(text)) return;
  if (text !== good) {
    state.bad.add(text);
    return buzz(explainChoice(text, L));
  }
  afterMain();
}

function pickTotal(n) {
  const L = LEVELS[state.i];
  const good = L.g * L.e;
  if (state.bad.has(String(n))) return;
  if (n !== good) {
    state.bad.add(String(n));
    return buzz(explainTotal(n, L));
  }
  afterMain();
}

function next() {
  if (state.i >= LEVELS.length - 1) {
    state.screen = "end";
    Sound.win();
    confetti();
    render();
    return;
  }
  state.i += 1;
  startLevel();
}

function renderDots() {
  document.getElementById("dots").innerHTML = LEVELS.map((_, i) => {
    const cls = i === state.i && state.screen === "level" ? "on" : (state.stars[i] ? "done" : "");
    return "<i class=\"" + cls + "\"></i>";
  }).join("");
}

function fruitsHTML(n, item) {
  const mark = state.pop ? n - 1 : -1;
  let html = "";
  for (let i = 0; i < n; i++) html += "<span class=\"" + (i === mark ? "pop" : "") + "\">" + glyph(item) + "</span>";
  return html || "<span class=\"label\">ცარიელი</span>";
}

function gardenHTML(groups, item, fix) {
  return groups.map((n, idx) => {
    const buttons = fix
      ? "<div class=\"fix-actions\"><button class=\"tiny\" type=\"button\" data-act=\"sub\" data-i=\"" + idx + "\">−</button><button class=\"tiny\" type=\"button\" data-act=\"add\" data-i=\"" + idx + "\">+</button></div>"
      : "";
    return "<div class=\"crate\"><div class=\"label\">ჯგუფი " + (idx + 1) + "</div><div class=\"fruits\">" + fruitsHTML(n, item) + "</div>" + buttons + "</div>";
  }).join("");
}

function starText(n) { return "★".repeat(n) + "☆".repeat(3 - n); }

function render() {
  renderDots();
  const L = LEVELS[state.i];
  if (state.screen === "intro") {
    stage.innerHTML = "<div class=\"hero card\"><h2>ჯერ ჯგუფები, მერე ნამრავლი</h2><p>5 გუნდი, თითოში 6 მოსწავლე, არის <b>6 + 6 + 6 + 6 + 6</b> და მოკლედ <b>5 · 6 = 30</b>.</p><p>4 + 3 კი სხვა რამეა: აქ ორი რიცხვი ერთმანეთს ემატება, ჯგუფები კი არ მეორდება.</p><div class=\"row\"><button type=\"button\" data-act=\"start\">ბაღში შესვლა</button></div></div>";
    return;
  }
  if (state.screen === "end") {
    const total = state.stars.reduce((a, b) => a + b, 0);
    stage.innerHTML = "<div class=\"card done\"><h2>ბაღი მზადაა</h2><p class=\"stars\">" + starText(Math.round(total / LEVELS.length)) + "</p><p>სულ " + total + " ვარსკვლავი " + (LEVELS.length * 3) + "-დან.</p><p>გამრავლება განმეორებითი შეკრებაა. ჯგუფების რაოდენობა და თითო ჯგუფის წევრი ნამრავლის ორი მამრავლია.</p><div class=\"row\"><button type=\"button\" data-act=\"again\">თავიდან</button><a href=\"2-tsvlis-tsekva.html\"><button type=\"button\">შემდეგი თამაში</button></a></div></div>";
    return;
  }

  const groups = currentGroups();
  const same = groups.length && groups.every((n) => n === groups[0]);
  const formula = !groups.length
    ? "ჯერ ჯგუფი დაამატე"
    : !same
      ? "ჯგუფები ჯერ თანაბარი არ არის"
      : sumText(groups[0], groups.length) + " = " + groups.length + " · " + groups[0];

  let body = "<div class=\"" + (state.shake ? "shake" : "") + "\"><div class=\"kicker\">" + (state.i + 1) + " / " + LEVELS.length + " · " + L.title + "</div>";
  if (state.step !== "done") body += "<p class=\"mission\">" + L.lead + "</p>";
  body += "<div class=\"garden\">" + gardenHTML(groups, L.item, L.mode === "fix" && state.step === "build") + "</div>";
  if (state.step === "build" || state.step === "total" || state.step === "done") body += "<div class=\"formula\">" + formula + "</div>";

  if (state.step === "build" && (L.mode === "plant" || L.mode === "story")) {
    body += "<div class=\"controls\"><div class=\"stepper\"><span>ჯგუფი</span><button class=\"tiny\" type=\"button\" data-act=\"gdec\">−</button><b>" + state.g + "</b><button class=\"tiny\" type=\"button\" data-act=\"ginc\">+</button></div>";
    body += "<div class=\"stepper\"><span>თითოში</span><button class=\"tiny\" type=\"button\" data-act=\"edec\">−</button><b>" + state.e + "</b><button class=\"tiny\" type=\"button\" data-act=\"einc\">+</button></div>";
    body += "<button type=\"button\" data-act=\"check\">შევამოწმოთ</button></div>";
  }
  if (state.step === "build" && L.mode === "fix") {
    body += "<div class=\"row\"><button type=\"button\" data-act=\"check\">შევამოწმოთ</button></div>";
  }
  if (state.step === "read") {
    body += "<div class=\"choices\">" + state.options.map((op) => {
      const cls = state.bad.has(op) ? "bad" : "";
      return "<button class=\"choice " + cls + "\" type=\"button\" data-act=\"expr\" data-v=\"" + op + "\">" + op + "</button>";
    }).join("") + "</div>";
  }
  if (state.step === "total") {
    body += "<div class=\"choices\">" + state.totalOptions.map((n) => {
      const cls = state.bad.has(String(n)) ? "bad" : "";
      return "<button class=\"choice " + cls + "\" type=\"button\" data-act=\"total\" data-v=\"" + n + "\">" + n + "</button>";
    }).join("") + "</div>";
  }
  if (state.step === "done") {
    const product = L.g * L.e;
    body += "<div class=\"card done\"><h2>" + L.g + " · " + L.e + " = " + product + "</h2><p>" + sumText(L.e, L.g) + " = " + product + "</p><p>ორივე გზით ერთი პასუხი გამოდის. გამრავლება განმეორებითი შეკრებაა.</p><p class=\"stars\">" + starText(state.stars[state.i]) + "</p><button type=\"button\" data-act=\"next\">" + (state.i === LEVELS.length - 1 ? "შედეგი" : "შემდეგი") + "</button></div>";
  }
  body += "<p class=\"msg " + state.msgKind + "\" role=\"status\">" + state.msg + "</p>";
  if (state.step === "build" || state.step === "read") {
    body += "<div class=\"row\"><button class=\"ghost\" type=\"button\" data-act=\"hint\">დახმარება</button></div>";
  }
  body += "</div>";
  stage.innerHTML = body;
  state.pop = false;
}

stage.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "start" || act === "again") {
    state.i = 0; state.stars = []; state.screen = "level"; startLevel(); return;
  }
  if (act === "next") return next();
  if (act === "hint") {
    state.msg = "ჯგუფების რაოდენობა პირველი მამრავლია. თითო ჯგუფში რამდენიცაა — მეორე. 4 + 3 შეკრებაა, 4 · 3 კი ოთხი ერთნაირი სამეული.";
    state.msgKind = "";
    render();
    return;
  }
  if (act === "gdec") { state.g = Math.max(1, state.g - 1); state.pop = false; render(); return; }
  if (act === "ginc") { state.g = Math.min(9, state.g + 1); render(); return; }
  if (act === "edec") { state.e = Math.max(1, state.e - 1); render(); return; }
  if (act === "einc") { state.e = Math.min(9, state.e + 1); state.pop = true; Sound.tap(); render(); return; }
  if (act === "add") {
    state.groups[Number(btn.dataset.i)] += 1;
    state.pop = true; Sound.tap(); render(); return;
  }
  if (act === "sub") {
    const i = Number(btn.dataset.i);
    state.groups[i] = Math.max(0, state.groups[i] - 1);
    render(); return;
  }
  if (act === "check") return checkBuild();
  if (act === "expr") return pickExpr(btn.dataset.v);
  if (act === "total") return pickTotal(Number(btn.dataset.v));
});

document.getElementById("reset").onclick = () => { state.i = 0; state.stars = []; state.screen = "intro"; render(); };
document.getElementById("mute").onclick = () => {
  const muted = Sound.toggle();
  document.getElementById("mute").textContent = muted ? "ჩუმად" : "ხმა";
};
document.getElementById("mute").textContent = Sound.muted ? "ჩუმად" : "ხმა";
render();

function confetti() {
  const layer = document.createElement("div");
  layer.className = "confetti";
  const colors = ["#e7a317", "#e23b3b", "#2f9e6b", "#3d7ea6", "#ffffff"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "%";
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 0.25) + "s";
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1600);
}

function makeSound() {
  let ctx, muted = false;
  try { muted = localStorage.getItem("gt-mute") === "1"; } catch (e) {}
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, when) {
    if (muted) return;
    try {
    const c = ac();
    const t = c.currentTime + (when || 0);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem("gt-mute", muted ? "1" : "0"); } catch (e) {} return muted; },
    ok() { tone(523, .12); tone(784, .16, .1); },
    bad() { tone(196, .18); },
    tap() { tone(660, .04); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, i * .1)); }
  };
}
